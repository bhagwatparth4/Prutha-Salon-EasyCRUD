services:
  db:
    image: mariadb:latest
    container_name: prutha-salon-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: admin
      MARIADB_DATABASE: salon_db
    volumes:
      - data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: prutha-salon-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: salon_db
      DB_USER: root
      DB_PASSWORD: admin

  frontend:
    build:
      context: ./frontend
    container_name: prutha-salon-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  data:
